name: CFF + Zenodo Validation

on:
  push:
    paths:
      - CITATION.cff
    branches-ignore:
      - "auto-update-*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
      
          python << EOF
          import yaml
      
          with open("CITATION.cff") as f:
              data = yaml.safe_load(f)
      
          data["version"] = "$VERSION"
      
          with open("CITATION.cff", "w") as f:
              yaml.dump(data, f, sort_keys=False)
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cffconvert
        run: |
          pip install cffconvert

      - name: Validate CITATION.cff
        run: |
          cffconvert --validate

      - name: Generate .zenodo.json
        run: |
          cffconvert --infile CITATION.cff --format zenodo > .zenodo.json

      - name: Inject roles into zenodo.json
        run: |
          python << 'EOF'
          import json

          with open(".zenodo.json") as f:
              data = json.load(f)

          name_map = {
              "Byrtus, Roman": "ProjectMember",
              "Druckmüllerová, Hana": "Researcher",
              "Habbal, Shadia": "Researcher",
              "Satýnek, Daniel": "Researcher"
          }
          
          for c in data.get("creators", []):
              c["type"] = name_map.get(c.get("name"), "Other")

          with open(".zenodo.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Validate generated Zenodo JSON
        run: |
          python -m json.tool .zenodo.json > /dev/null

      - name: Commit updated .zenodo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .zenodo.json

          git diff --cached --quiet || git commit -m "Update .zenodo.json from CITATION.cff"

          git push
